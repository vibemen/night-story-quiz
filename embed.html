<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Город после полуночи — тест</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#29243a;font:16px/1.5 system-ui,Arial,sans-serif}.card{border:1px solid #e6ddee;border-radius:20px;padding:24px;background:linear-gradient(140deg,#fffefa,#f8f3ff);box-shadow:0 6px 18px #3c24520c}.tag{color:#7a5eb4;font-weight:800;font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:10px}h2{font-size:21px;line-height:1.25;margin:0 0 7px}.sub{font-size:13px;color:#746981;margin:0 0 15px}.answers{display:grid;gap:9px}.answer{cursor:pointer;display:flex;gap:10px;align-items:center;background:white;border:1.5px solid #e5dfea;padding:10px 12px;min-height:47px;border-radius:12px}.answer:hover,.answer:has(input:checked){border-color:#967dd7;background:#f3edff}.answer input{accent-color:#7154b7;min-width:17px;min-height:17px}.answer span{font-size:14px;line-height:1.4}.footer{color:#756b83;font-size:12px;margin-top:13px}.primary{background:#7154b7;border:0;color:white;padding:13px 14px;border-radius:12px;font:700 14px system-ui;width:100%;cursor:pointer}.primary:disabled{background:#aaa2bc;cursor:not-allowed}.small{background:transparent;border:1px solid #cfc3de;border-radius:9px;margin-top:14px;color:#615276;padding:8px 12px;cursor:pointer}.result{display:none;margin-top:20px;border-top:1px solid #e5deeb;padding-top:17px}.result.show{display:block}.result h3{font-size:20px;margin:0 0 8px}.result p{margin:0;color:#5d536b;font-size:14px}.points{font-size:31px;font-weight:800;color:#6c4bb6;margin:8px 0}.warning{font-size:12px;color:#816023;margin-top:12px}.footnote{font-size:11px;color:#8a8294;margin-top:8px}@media(max-width:420px){.card{padding:17px 14px}h2{font-size:18px}.answer span{font-size:13px}}
</style></head><body><main id="app"></main><script>
(()=>{'use strict';
const KEY='nightcity-quiz-v1',CH='nightcity-quiz-broadcast-v1';
const data={
1:{name:'Письмо с невозможной датой',question:'Что ты сделаешь с загадочным письмом?',answers:[['a','Изучу конверт и печать',1],['b','Открою и прочитаю письмо',2],['c','Попытаюсь найти отправителя',3],['d','Сразу пойду по указанному адресу',4]]},
2:{name:'Поезд без расписания',question:'Перед тобой останавливается неизвестный поезд. Твой выбор?',answers:[['a','Останусь на перроне и понаблюдаю',1],['b','Спрошу проводника о маршруте',2],['c','Загляну внутрь первого вагона',3],['d','Войду, не зная конечной станции',4]]},
3:{name:'Библиотека забытых вещей',question:'Тебе разрешено взять один предмет. Что выберешь?',answers:[['a','Карту безопасных дорог',1],['b','Фонарь, который не гаснет',2],['c','Компас, указывающий на мечты',3],['d','Ключ, открывающий любые двери',4]]},
4:{name:'Остановка времени',question:'Город предлагает последнее решение. Что сделаешь?',answers:[['a','Останусь, чтобы выслушать его историю',1],['b','Сохраню тайну города для себя',2],['c','Приглашу других увидеть это чудо',3],['d','Поверну стрелки часов и изменю ход ночи',4]]}
};
const params=new URLSearchParams(location.search),id=Number(params.get('q')),isResult=params.has('result'),app=document.querySelector('#app');
let state={},storeOK=true,revealed=false,channel=null;
function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');return v&&typeof v==='object'?v:{}}catch(e){storeOK=false;return {}}}
state=read();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storeOK=true}catch(e){storeOK=false}}
function emit(m){try{channel?.postMessage(m)}catch(e){}}
function merge(v){if(!v||typeof v!=='object')return;let changed=false;for(const k of Object.keys(data)){const incoming=v[k],old=state[k];if(incoming&&data[k].answers.some(x=>x[0]===incoming.choice)&&(!old||incoming.time>old.time)){state[k]=incoming;changed=true}}if(changed){save();update()}}
try{channel=new BroadcastChannel(CH);channel.onmessage=e=>{const m=e.data;if(!m)return;if(m.type==='hello')emit({type:'snapshot',state});if(m.type==='snapshot')merge(m.state);if(m.type==='set')merge({[m.id]:m.value});if(m.type==='reset'){state={};try{localStorage.removeItem(KEY)}catch(e){}revealed=false;update()}}}catch(e){}
window.addEventListener('storage',e=>{if(e.key===KEY){state=read();update()}});
const valid=k=>state[k]&&data[k].answers.some(o=>o[0]===state[k].choice);
function score(){let count=0,total=0;for(const k of Object.keys(data)){if(valid(k)){count++;total+=data[k].answers.find(o=>o[0]===state[k].choice)[2]}}return {count,total}}
function end(score){if(score<=7)return ['🌙 Тихий хранитель','Ты замечаешь то, что другие пропускают: тихие голоса, мерцание фонарей, маленькие детали. Твоя сила в чуткости и наблюдательности. Город доверил бы тебе свои самые хрупкие тайны.'];if(score<=11)return ['🗝️ Путешественник между строк','Ты умеешь сочетать осторожность с любопытством. Тебя зовут неизвестные дороги, но ты не теряешь себя в пути. Город подарил бы тебе карту мест, которых ещё нет ни в одном атласе.'];return ['✨ Создатель новых дорог','Ты смело идёшь навстречу неизвестному и способен менять историю своими решениями. Город доверил бы тебе ключ от часовой башни, ведь новые главы начинаются с твоего шага.']}
function showQuestion(){let q=data[id];app.innerHTML=`<div class="card"><div class="tag">Вопрос ${id} из 4</div><h2>${q.question}</h2><p class="sub">${q.name}</p><div class="answers" role="radiogroup" aria-label="Выберите ответ">${q.answers.map(a=>`<label class="answer"><input type="radio" name="q${id}" value="${a[0]}"><span>${a[1]}</span></label>`).join('')}</div><div class="footer" id="hint">Выбери ответ. Баллы посчитаются автоматически.</div></div>`;
app.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{const value={choice:input.value,time:Date.now()};state[id]=value;save();emit({type:'set',id:String(id),value});update()}));update()}
function showResult(){app.innerHTML='<div class="card"><div class="tag">Финал истории</div><h2>Кто ты в ночном городе?</h2><p class="sub" id="progress"></p><button class="primary" id="reveal">Узнать свой результат</button><div class="result" id="result"><div class="tag">Твой финал</div><h3 id="type"></h3><p id="desc"></p><div class="points" id="points"></div><div class="footnote">Сумма баллов за четыре решения</div></div><button class="small" id="reset">Пройти заново</button><p class="warning" id="warning" hidden>Браузер ограничивает сохранение ответов в iframe. Если баллы не обновляются, открой тест отдельно или проверь настройки конфиденциальности.</p></div>';document.querySelector('#reveal').onclick=()=>{revealed=true;update()};document.querySelector('#reset').onclick=()=>{state={};revealed=false;try{localStorage.removeItem(KEY)}catch(e){}emit({type:'reset'});update()};update()}
function update(){if(!isResult){if(!data[id])return;app.querySelectorAll('input').forEach(input=>input.checked=valid(id)&&state[id].choice===input.value);const hint=document.querySelector('#hint');if(hint)hint.textContent=valid(id)?'Ответ сохранён. Продолжай читать историю.':'Выбери ответ. Баллы посчитаются автоматически.';return}
const v=score(),p=document.querySelector('#progress');if(!p)return;p.textContent=`Отвечено на ${v.count} из 4 вопросов${v.count<4?'. Вернись к пропущенным вопросам.':''}`;document.querySelector('#reveal').disabled=v.count<4;document.querySelector('#result').classList.toggle('show',revealed&&v.count===4);if(revealed&&v.count===4){const [title,desc]=end(v.total);document.querySelector('#type').textContent=title;document.querySelector('#desc').textContent=desc;document.querySelector('#points').textContent=`${v.total} / 16`;}document.querySelector('#warning').hidden=storeOK}
if(isResult)showResult();else if(data[id])showQuestion();else app.textContent='Укажи ?q=1, ?q=2, ?q=3, ?q=4 или ?result=1';emit({type:'hello'});window.addEventListener('pageshow',()=>{merge(read());emit({type:'hello'})});
})();
</script></body></html>
